services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: turnover
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d turnover"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
