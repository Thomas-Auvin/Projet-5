[tool.poetry]
name = "projet5-turnover-api"
version = "0.1.0"
description = "POC Projet 5 : API FastAPI pour le modèle P4 (turnover), avec tests et CI/CD"
authors = ["Thomas Auvin <thomas.auvin@hotmail.fr>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
pandas = ">=2.3.3,<3.0.0"
matplotlib = ">=3.10.6,<4.0.0"
seaborn = ">=0.13.2,<0.14.0"
polars = ">=1.34.0,<2.0.0"
numpy = ">=2.3.3,<3.0.0"
mlxtend = ">=0.23.4,<0.24.0"
shap = ">=0.48.0,<0.49.0"
scikit-learn = ">=1.7.2,<2.0.0"
ipykernel = ">=6.30.1,<7.0.0"
jupyterlab = ">=4.4.9,<5.0.0"
xgboost = ">=3.0.5,<4.0.0"
imbalanced-learn = ">=0.14.0,<0.15.0"
fastapi = ">=0.121.2,<0.122.0"
uvicorn = { version = ">=0.38.0,<0.39.0", extras = ["standard"] }
pydantic = ">=2.12.4,<3.0.0"
sqlalchemy = "^2.0.44"
psycopg = {extras = ["binary"], version = "^3.2.12"}
python-multipart = "^0.0.20"
huggingface-hub = "^1.1.5"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^5.0.0"
pre-commit = "^4.5.0"
black = "^25.11.0"
ruff = "^0.14.6"
mypy = "^1.18.2"
bandit = "^1.9.2"
pip-audit = "^2.9.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = """
-q --maxfail=1 --disable-warnings
--cov=app --cov=db
--cov-report=term-missing:skip-covered
--cov-report=xml
--cov-fail-under=60
"""
pythonpath = ["."]


[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*.ipynb", "data/", "visualisations/", ".ipynb_checkpoints/"]


[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
pretty = true
show_error_codes = true
exclude = '''
(?x)(
  ^data/|
  ^visualisations/|
  \.ipynb_checkpoints/
)
'''

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["scripts.*"]
ignore_errors = true


[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
