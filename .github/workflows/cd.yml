name: CD to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare HF remote
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euxo pipefail
          if git remote get-url hf >/dev/null 2>&1; then
            git remote set-url hf "https://__token__:${HF_TOKEN}@huggingface.co/spaces/Thomas-Auvin/projet5-turnover-api"
          else
            git remote add hf "https://__token__:${HF_TOKEN}@huggingface.co/spaces/Thomas-Auvin/projet5-turnover-api"
          fi
          git fetch hf main || true
          echo "Local HEAD: $(git rev-parse HEAD)"
          echo "HF main  : $(git rev-parse remotes/hf/main || echo 'absent')"

      - name: Push to HF (force-with-lease)
        run: |
          set -euxo pipefail
          git push --force-with-lease hf HEAD:main
